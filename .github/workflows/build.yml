# Pipeline Build — Export Windows / Android / HTML5 builds (Fase D).
#
# Strategy post Fase D (plan BUILD_RELEASE_PLAN §5):
# - Target SUPPORTATI: Windows x64 + HTML5. Sono gli unici che entrano in una
#   release e gli unici su cui si fanno promesse.
# - Android e` un ESPERIMENTO non supportato: l'export fallisce nel container e
#   il progetto non ha una configurazione di firma (nessuna chiave `keystore/*`
#   in export_presets.cfg). L'APK, quando esce, e` firmato col keystore di
#   debug e NON e` distribuibile. Il job resta per non buttare il lavoro del
#   team, ma non gate-a nulla e non entra in release.yml (audit G-003).
# - Ogni job e` atomico: SHA256SUMS per artifact, size check in smoke-binaries
# - Fase F (successivo): build dipende da CI green via workflow_run trigger
#
# Uses barichello/godot-ci:4.7.1 container (include templates + Android SDK +
# Java 17). LFS: true per scaricare godot-sqlite multi-platform binaries.

name: build
run-name: "${{ github.event_name }} — ${{ github.ref_name }} — Build"

# Fase F (plan §7): build depends on CI green via workflow_run trigger.
# Branch push main -> CI runs -> (if green) build fires via workflow_run.
# Tag push v*.*.* -> build fires direttamente (release must build, even
#   if CI doesn't re-run on tag trigger).
# workflow_dispatch: fallback manuale con skip_ci_gate emergency.
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      skip_android:
        type: boolean
        default: false
        description: "Skip Android build (debug iterations)"
      skip_ci_gate:
        type: boolean
        default: false
        description: "Skip CI gate (emergency, solo admin)"

concurrency:
  group: build-${{ github.event.number || github.ref }}
  cancel-in-progress: true

# barichello/godot-ci container default shell e` busybox sh; forziamo bash
# per usare [[, ${VAR:0:N} substring, arithmetic (( )), etc.
defaults:
  run:
    shell: bash

env:
  GODOT_VERSION: "4.7.1"
  PROJECT_PATH: "v1"

jobs:
  ci-gate:
    name: "CI gate — verify CI passed"
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    # Fallisce se workflow_run fired con CI conclusion != success.
    # Su push tag / workflow_dispatch la condizione e` permissiva.
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success' ||
      inputs.skip_ci_gate == true
    steps:
      - name: Emit gate status
        run: |
          echo "Trigger: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "CI conclusion: ${{ github.event.workflow_run.conclusion }}"
          fi
          echo "CI gate PASS — build jobs may proceed"

  build-windows:
    name: "Build Windows x64"
    needs: [ci-gate]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    container:
      image: barichello/godot-ci@sha256:622e5ca81b54cd8038ecf7de5d157b47efc800d7cf635af2eec18a6aee4bab7e  # 4.7.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.1.stable
          if [ -d "/root/.local/share/godot/export_templates/4.7.1.stable" ]; then
            cp -r /root/.local/share/godot/export_templates/4.7.1.stable/* \
              ~/.local/share/godot/export_templates/4.7.1.stable/ 2>/dev/null || true
          fi

      - name: Compute artifact filename
        id: name
        run: |
          REF="${GITHUB_REF_NAME}"
          # Tag build: use ref_name (v1.0.0). Branch: use short SHA.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "fname=RelaxRoom-${REF}-x64.exe" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="${GITHUB_SHA:0:7}"
            echo "fname=RelaxRoom-dev-${SHORT_SHA}-x64.exe" >> "$GITHUB_OUTPUT"
          fi

      - name: Pre-import resources
        run: |
          cd "${{ env.PROJECT_PATH }}"
          godot --headless --import --path . || true
          godot --headless --import --path .

      - name: Export Windows release
        run: |
          mkdir -p builds/windows
          cd "${{ env.PROJECT_PATH }}"
          godot --headless --export-release "Windows Desktop" \
            "../builds/windows/${{ steps.name.outputs.fname }}"

      - name: Verify .exe created + size sane
        run: |
          cd builds/windows
          ls -lh
          # Size >= 50MB (template ~80MB + pck 15MB typical)
          SIZE=$(stat -c%s *.exe)
          if (( SIZE < 50000000 || SIZE > 400000000 )); then
            echo "ERROR: .exe size unexpected: $SIZE bytes"
            exit 1
          fi
          echo ".exe size OK: $SIZE bytes"

      - name: Compute SHA256SUMS
        run: |
          cd builds/windows
          sha256sum *.exe > SHA256SUMS.windows.txt
          cat SHA256SUMS.windows.txt

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: relaxroom-windows-${{ github.sha }}
          path: |
            builds/windows/*.exe
            builds/windows/SHA256SUMS.windows.txt
          retention-days: 30

  build-android:
    # Nome esplicito: nessun altro workflow deve poterlo scambiare per un gate
    # di rilascio. release.yml NON aspetta piu` questo check (audit G-003).
    name: "Build Android APK (sperimentale, non firmato)"
    needs: [ci-gate]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container:
      image: barichello/godot-ci@sha256:622e5ca81b54cd8038ecf7de5d157b47efc800d7cf635af2eec18a6aee4bab7e  # 4.7.1
    if: ${{ !inputs.skip_android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.1.stable
          if [ -d "/root/.local/share/godot/export_templates/4.7.1.stable" ]; then
            cp -r /root/.local/share/godot/export_templates/4.7.1.stable/* \
              ~/.local/share/godot/export_templates/4.7.1.stable/ 2>/dev/null || true
          fi

      - name: Prepare output dir
        run: mkdir -p builds/android

      # NIENTE iniezione di keystore di release (rimossa, audit G-003).
      # Lo step precedente decodificava i secret ANDROID_RELEASE_* e li
      # scriveva in export_presets.cfg con quattro `sed`. Tre di quei sed
      # cercavano chiavi `keystore/release*` che nel preset NON esistono e
      # non sono mai esistite: sostituivano zero occorrenze e uscivano 0.
      # Il risultato era una pipeline che *sembrava* firmare release Android
      # senza firmare niente. Finche` il progetto non decide di supportare
      # davvero Android, questo job produce solo APK di debug e non deve
      # dare l'impressione contraria.

      - name: Setup debug keystore
        # Sempre, anche sui tag: il keystore di debug e` l'unico che questo
        # progetto ha. Prima era gated sui non-tag perche` si presumeva che
        # sui tag arrivasse quello di release, che pero` non veniva mai
        # applicato al preset (G-003).
        run: |
          # barichello/godot-ci ships with debug.keystore at /root/.android/
          # Godot editor_settings-4.7.tres punta a ~/.android/debug.keystore
          # (vedi step successivo). Preset package/signed=false -> Godot usa
          # editor_settings debug per firmare APK -debug.
          mkdir -p ~/.android
          KEYSTORE_PATH="/root/.android/debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            cp "$KEYSTORE_PATH" ~/.android/debug.keystore
          else
            # Fallback if container image changes
            keytool -keyalg RSA -genkeypair -alias androiddebugkey \
              -keypass android \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -validity 9999 -deststoretype pkcs12
          fi

      - name: Configure Godot Android editor settings
        run: |
          mkdir -p ~/.config/godot
          JAVA_BIN=$(readlink -f "$(which java)")
          JAVA_DIR=$(dirname "$(dirname "$JAVA_BIN")")
          echo "Detected Java SDK: $JAVA_DIR"
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "$JAVA_DIR"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Compute artifact filename
        id: name
        run: |
          # Il suffisso `-unsigned-debug` e` parte del contratto: qualunque APK
          # esca da qui e` firmato col keystore di debug e non e`
          # distribuibile. Il nome lo dice, cosi` un file scaricato a mano non
          # puo` essere scambiato per un artefatto di rilascio.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "fname=RelaxRoom-${GITHUB_REF_NAME}-unsigned-debug.apk" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="${GITHUB_SHA:0:7}"
            echo "fname=RelaxRoom-dev-${SHORT_SHA}-unsigned-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Pre-import resources
        run: |
          cd "${{ env.PROJECT_PATH }}"
          godot --headless --import --path . || true
          godot --headless --import --path .

      - name: Export Android APK (debug, non firmato per la distribuzione)
        # L'export Android nel container barichello/godot-ci emette "Cannot
        # export project with preset 'Android' due to configuration errors"
        # senza dire quale. Il job resta non bloccante (Windows e HTML5 sono
        # i target di rilascio), ma l'esito viene registrato esplicitamente
        # invece di essere inghiottito: lo step successivo lo riporta nel
        # summary, cosi' "Android non prodotto" e' un fatto visibile e non
        # un silenzio che somiglia al successo.
        #
        # Sempre --export-debug: senza configurazione di firma nel preset, un
        # --export-release produrrebbe un APK non firmato e non installabile
        # che si spaccia per "release" (G-003).
        id: android_export
        continue-on-error: true
        run: |
          cd "${{ env.PROJECT_PATH }}"
          godot --headless --export-debug "Android" \
            "../builds/android/${{ steps.name.outputs.fname }}" || \
            echo "Android debug export failed — see known-issue comment"

      - name: Report Android export outcome
        if: always()
        run: |
          OUTCOME="${{ steps.android_export.outcome }}"
          if [ -f builds/android/*.apk ] 2>/dev/null || ls builds/android/*.apk >/dev/null 2>&1; then
            echo "### Android (sperimentale): APK di debug prodotto (step $OUTCOME)" >> "$GITHUB_STEP_SUMMARY"
            echo "Firmato col keystore di debug: NON distribuibile, non entra in nessuna release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Android (sperimentale): NESSUN APK prodotto (step $OUTCOME)" >> "$GITHUB_STEP_SUMMARY"
            echo "Problema noto del container: preset Android con errori di configurazione." >> "$GITHUB_STEP_SUMMARY"
            echo "Windows e HTML5 non sono interessati: Android non e' un target supportato." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify APK (if present)
        continue-on-error: true
        run: |
          cd builds/android
          ls -lh || echo "(no android artifacts)"
          if ! ls *.apk >/dev/null 2>&1; then
            echo "Skipping verify: no APK generated (see the outcome step above)"
            exit 0
          fi
          APK=$(ls *.apk | head -1)
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          if (( SIZE < 20000000 || SIZE > 300000000 )); then
            echo "WARN: APK size unexpected: $SIZE bytes"
          fi
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose "$APK" || echo "WARN: apksigner verify failed"
          fi

      - name: Compute SHA256SUMS (if APK present)
        continue-on-error: true
        run: |
          cd builds/android
          if ls *.apk >/dev/null 2>&1; then
            sha256sum *.apk > SHA256SUMS.android.txt
            cat SHA256SUMS.android.txt
          else
            # Create placeholder so upload-artifact doesn't fail on empty dir
            echo "# No APK generated — Android export is experimental and unsupported" > SHA256SUMS.android.txt
          fi

      - name: Upload Android artifact (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relaxroom-android-${{ github.sha }}
          path: |
            builds/android/*.apk
            builds/android/SHA256SUMS.android.txt
          retention-days: 30
          if-no-files-found: warn

  build-html5:
    name: "Build HTML5 Web"
    needs: [ci-gate]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    container:
      image: barichello/godot-ci@sha256:622e5ca81b54cd8038ecf7de5d157b47efc800d7cf635af2eec18a6aee4bab7e  # 4.7.1
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.1.stable
          if [ -d "/root/.local/share/godot/export_templates/4.7.1.stable" ]; then
            cp -r /root/.local/share/godot/export_templates/4.7.1.stable/* \
              ~/.local/share/godot/export_templates/4.7.1.stable/ 2>/dev/null || true
          fi

      - name: Pre-import resources
        run: |
          cd "${{ env.PROJECT_PATH }}"
          godot --headless --import --path . || true
          godot --headless --import --path .

      - name: Export HTML5
        run: |
          mkdir -p builds/html5
          cd "${{ env.PROJECT_PATH }}"
          godot --headless --export-release "Web" ../builds/html5/index.html

      - name: Verify HTML5 output
        run: |
          ls -lh builds/html5/
          test -f builds/html5/index.html
          test -f builds/html5/index.pck
          test -f builds/html5/index.wasm
          grep -q "Relax Room" builds/html5/index.html || {
            echo "ERROR: index.html missing project name"; exit 1
          }

      - name: Compute artifact filename
        id: name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "fname=RelaxRoom-${GITHUB_REF_NAME}-html5.zip" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="${GITHUB_SHA:0:7}"
            echo "fname=RelaxRoom-dev-${SHORT_SHA}-html5.zip" >> "$GITHUB_OUTPUT"
          fi

      - name: Zip HTML5 + compute SHA256
        run: |
          cd builds
          zip -r "${{ steps.name.outputs.fname }}" html5/
          sha256sum "${{ steps.name.outputs.fname }}" > SHA256SUMS.html5.txt
          ls -lh
          cat SHA256SUMS.html5.txt

      - name: Upload HTML5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: relaxroom-html5-${{ github.sha }}
          path: |
            builds/*.zip
            builds/SHA256SUMS.html5.txt
          retention-days: 30

  smoke-binaries:
    name: "Smoke test built binaries"
    needs: [build-windows, build-html5]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify Windows .exe structural integrity
        run: |
          exe_path=$(find artifacts -name "*.exe" | head -1)
          if [ -z "$exe_path" ]; then
            echo "ERROR: no .exe artifact found"
            exit 1
          fi
          size=$(stat -c%s "$exe_path")
          echo "Windows .exe: $exe_path ($size bytes)"
          # MZ header check (PE executable magic bytes)
          head -c 2 "$exe_path" | xxd | grep -q "4d5a" || {
            echo "ERROR: .exe does not start with MZ magic bytes"; exit 1
          }

      - name: Verify HTML5 contains critical strings
        run: |
          zip_path=$(find artifacts -name "*-html5.zip" | head -1)
          if [ -z "$zip_path" ]; then
            echo "ERROR: no html5 zip artifact found"
            exit 1
          fi
          unzip -p "$zip_path" html5/index.html | grep -q "Relax Room" || {
            echo "ERROR: index.html missing project name"; exit 1
          }
          echo "HTML5 zip OK"

      - name: Verify SHA256SUMS parseable
        run: |
          for f in $(find artifacts -name "SHA256SUMS*.txt"); do
            echo "=== $f ==="
            cat "$f"
            # Skip file se contiene solo righe commento (Android placeholder
            # quando export fallisce, vedi build-android known-issue).
            # Usiamo if-grep patterns: exit-codes parlanti senza pipefail.
            if ! grep -Eq '^[^#[:space:]]' "$f"; then
              echo "(comment-only placeholder — skip validation)"
              continue
            fi
            # Parse + validate format (<hex64> <2 spaces> <filename>)
            grep -Eq '^[0-9a-f]{64}  \S+' "$f" || {
              echo "ERROR: $f format invalid"; exit 1
            }
          done
