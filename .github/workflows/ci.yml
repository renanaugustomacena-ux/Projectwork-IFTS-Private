# Pipeline CI — Lint GDScript + Validazione Moduli
#
# Documentazione:
# Eseguita su ogni push al branch main e su ogni PR verso main.
# Job paralleli: lint, validazione JSON, sprite, cross-reference, schema DB,
# focus, versione, binari addon, keystore, segnali, conteggi README, pixel art;
# poi smoke-headless -> deep-tests in container Godot 4.7.1.

name: ci
run-name: "${{ github.head_ref || github.ref_name }} — CI"

on:
  pull_request:
    branches: [main]
    paths:
      - "v1/**"
      - "ci/**"
      - ".github/workflows/**"
      - "gdlintrc"
      - "gdformatrc"
      - "scripts/**"
      - "tools/**"
  push:
    branches: [main]
    paths:
      - "v1/**"
      - "ci/**"
      - ".github/workflows/**"
      - "gdlintrc"
      - "gdformatrc"
      - "scripts/**"
      - "tools/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "GDScript Lint & Format"
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install -r ci/requirements.txt

      - name: Run gdlint
        run: gdlint v1/scripts/ v1/tests/

      - name: Check formatting
        run: gdformat --check v1/scripts/ v1/tests/

  validate-json:
    name: "Validate JSON Catalogs"
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate catalog structure
        run: python ci/validate_json_catalogs.py v1/data

  validate-sprites:
    name: "Validate Sprite Paths"
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check sprite file existence
        run: python ci/validate_sprite_paths.py v1

  validate-crossrefs:
    name: "Validate Cross-References"
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check constants vs catalogs
        run: python ci/validate_cross_references.py v1/scripts/utils/constants.gd v1/data

  validate-db:
    name: "Validate DB Schema"
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate SQL syntax (post B-033 split -> schema.gd)
        run: python ci/validate_db_schema.py v1/scripts/autoload/database/schema.gd

  validate-button-focus:
    name: "Validate Button.new() focus_mode"
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check every runtime Button has focus_mode (B-001/B-003 regression guard)
        run: python ci/validate_button_focus.py v1/scripts

  validate-version:
    name: "Validate version sync"
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check v1/VERSION matches export_presets + project.godot + constants.gd
        run: python ci/validate_version_sync.py

  validate-addon-binaries:
    name: "Validate addon binary checksums (supply chain)"
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      # I binari GDExtension sono committati: senza checksum uno scambio di
      # .dll o .so passerebbe come un normale diff binario, invisibile in
      # review. Il file SHA256SUMS li ancora a un contenuto noto.
      - name: Verify godot-sqlite binaries against SHA256SUMS
        run: |
          cd v1/addons/godot-sqlite/bin
          sha256sum -c ../SHA256SUMS

  validate-no-keystore:
    name: "Validate no keystore tracked (Fase B guard)"
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan for *.keystore / *.jks / *.p12 / export_credentials.cfg
        run: python ci/validate_no_keystore.py

  validate-signals:
    name: "Validate SignalBus Count"
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check signal count floor + no duplicates
        run: python ci/validate_signal_count.py v1/scripts/autoload/signal_bus.gd --min 45

  validate-doc-counts:
    name: "Validate README counts vs repository"
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Regola del repo: nessun numero copiato dalla revisione precedente. Lo
      # script misura segnali, script, test, moduli, scene, cataloghi, tabelle,
      # autoload, decorazioni, sporco e personaggi e li confronta con i
      # `**N etichetta**` dichiarati in README.md e v1/README.md.
      - name: Compare declared counts with measured ones
        run: python ci/validate_doc_counts.py .

  validate-pixelart:
    name: "Validate Pixel-Art Deliverables"
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install -r ci/requirements.txt

      - name: Check palette is in sync with male/old sources
        run: python ci/extract_palette.py --check

      - name: Validate deliverables (sizes, naming, .aseprite sources, palette)
        run: python ci/validate_pixelart_deliverables.py --check-palette

      - name: Check male_rose derived sheets match male/old source
        run: python ci/recolor_character.py --check

  smoke-headless:
    name: "Headless Boot Smoke"
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    container:
      image: barichello/godot-ci@sha256:622e5ca81b54cd8038ecf7de5d157b47efc800d7cf635af2eec18a6aee4bab7e  # 4.7.1
    steps:
      - uses: actions/checkout@v4

      - name: Import project resources
        run: |
          godot --headless --import --path v1/ || true

      - name: Run smoke test
        run: |
          cd "$GITHUB_WORKSPACE"
          # Inline instead of calling scripts/smoke_test.sh so the container
          # does not need bash-specific features; parity with the shell script.
          rm -f /tmp/smoke_ci.log
          timeout 12 godot --headless --path v1/ --quit > /tmp/smoke_ci.log 2>&1
          RC=$?
          echo "Godot exit code: $RC"
          PARSE=$(grep -c "Parse Error" /tmp/smoke_ci.log || true)
          SCRIPT=$(grep -c "SCRIPT ERROR" /tmp/smoke_ci.log || true)
          PARSE=${PARSE:-0}
          SCRIPT=${SCRIPT:-0}
          echo "Parse errors: $PARSE"
          echo "Script errors: $SCRIPT"
          tail -20 /tmp/smoke_ci.log
          if [ "$RC" -ne 0 ] || [ "$PARSE" -gt 0 ] || [ "$SCRIPT" -gt 0 ]; then
            echo "FAIL: headless boot regressed"
            exit 1
          fi
          echo "PASS: headless boot"

  deep-tests:
    name: "Deep Integration Tests"
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    container:
      image: barichello/godot-ci@sha256:622e5ca81b54cd8038ecf7de5d157b47efc800d7cf635af2eec18a6aee4bab7e  # 4.7.1
    needs: [smoke-headless]
    steps:
      - uses: actions/checkout@v4

      - name: Import project resources
        # L'editor headless, uscendo, scrive `objectdb_snapshots/` nella user
        # dir del progetto (Godot 4.7, leak report). Senza questo XDG_DATA_HOME
        # usa-e-getta la cartella finiva in $HOME/.local/share/RelaxRoom e la
        # prova d'isolamento qui sotto la scambiava per una scrittura della
        # suite (CI rossa dal 2026-08-09 con 250 test verdi).
        run: |
          XDG_DATA_HOME=/tmp/import-home godot --headless --import --path v1/ || true

      - name: Run deep integration test suite
        run: |
          cd "$GITHUB_WORKSPACE"
          # Invasive suite: i moduli sono elencati in v1/tests/README.md
          # (conteggio misurato da ci/validate_doc_counts.py).
          #
          # SEMPRE via il wrapper, mai `godot ... test_runner.tscn` diretto: la
          # suite scrive save_data.json / cozy_room.db / integrity.key dentro
          # `user://`, che e` il profilo reale del giocatore. deep_test.sh crea
          # una user dir usa-e-getta per ogni run e ci pianta il sentinella che
          # test_runner.gd pretende di trovare prima di eseguire un solo test
          # (audit G-053).
          #
          # Pass criterion: il test_runner stampa "ALL PASS" + "Totals: X pass,
          # 0 fail" dopo aver eseguito TUTTE le assertion. Questo e` il ground
          # truth a livello-assertion.
          #
          # Godot exit code e` rumore post-test: RID leaks da CanvasItem +
          # TextServer a shutdown producono exit 2 anche con tutti i test OK.
          # Le leak sono debito tecnico del runner (scene instantiation in
          # loop), non regressione dei test. Se usassimo exit code come
          # gate, avremmo falsi rossi ad ogni run.
          GODOT_BIN=godot bash scripts/deep_test.sh --timeout 90 \
            | tee /tmp/deep_ci.log || true
          # Prova d'isolamento eseguita ad ogni run: la user dir "vera" di
          # questo runner non deve nemmeno esistere a fine suite.
          REAL_PROFILE="${XDG_DATA_HOME:-$HOME/.local/share}/RelaxRoom"
          if [ -e "$REAL_PROFILE" ]; then
            echo "FAIL: la suite ha scritto nel profilo reale ($REAL_PROFILE)"
            ls -la "$REAL_PROFILE"
            exit 1
          fi
          echo "PASS: isolamento user:// confermato ($REAL_PROFILE assente)"
          if grep -q "✅ ALL PASS" /tmp/deep_ci.log && grep -qE "Totals: [0-9]+ pass, 0 fail" /tmp/deep_ci.log; then
            echo "PASS: deep tests all green (assertion-level)"
          else
            echo "FAIL: deep tests did not report ALL PASS"
            grep -E "FAILURES:|❌|✗|Totals:" /tmp/deep_ci.log | tail -20
            exit 1
          fi

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-test-results-${{ github.sha }}
          path: /tmp/deep_ci.log
          retention-days: 14
