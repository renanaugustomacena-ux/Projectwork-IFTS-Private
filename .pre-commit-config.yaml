# Pre-commit hooks per Relax Room.
# Esegue controlli automatici prima di ogni commit per prevenire regressioni:
# - trailing whitespace e newline finale
# - YAML validi
# - GDScript formattato (gdformat) e linted (gdlint)
#
# Setup utente (una volta sola):
#   pip install --user pre-commit
#   pre-commit install
#
# Esecuzione manuale su tutti i file:
#   pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(v1/assets/|.*\.import$)
      - id: end-of-file-fixer
        exclude: ^(v1/assets/|.*\.import$)
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=5120"]

  # Stessa versione di ci/requirements.txt e degli stessi percorsi della CI
  # (v1/scripts E v1/tests): un hook piu` lasco della CI lascia passare
  # commit che poi falliscono online.
  - repo: https://github.com/Scony/godot-gdscript-toolkit
    rev: 4.5.0
    hooks:
      - id: gdlint
        files: ^v1/(scripts|tests)/.*\.gd$
      - id: gdformat
        files: ^v1/(scripts|tests)/.*\.gd$
        args: ["--check"]

  # Validator custom, gli stessi script della CI (niente copie piu` deboli).
  - repo: local
    hooks:
      - id: button-focus-mode
        name: Check Button.new()/slider/OptionButton focus_mode (ci/validate_button_focus.py)
        entry: python ci/validate_button_focus.py v1/scripts
        language: system
        pass_filenames: false
        files: ^v1/scripts/.*\.gd$
      - id: version-sync
        name: Check v1/VERSION matches presets/project/constants
        entry: python ci/validate_version_sync.py
        language: system
        pass_filenames: false
        files: ^(v1/VERSION|v1/export_presets\.cfg|v1/project\.godot|v1/scripts/utils/constants\.gd)$
      - id: doc-counts
        name: Check README counts vs repository (ci/validate_doc_counts.py)
        entry: python ci/validate_doc_counts.py .
        language: system
        pass_filenames: false
        files: ^(README\.md|v1/README\.md|v1/scripts/|v1/tests/|v1/scenes/|v1/data/)
